<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON CATALOG · Туториалы</title>
    
    <style>
        /* БАЗОВЫЕ СТИЛИ */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        /* ЦВЕТА ДЛЯ ТЕМНОЙ ТЕМЫ */
        :root { 
            --bg-color: #0b0e1a; 
            --card-bg: rgba(18, 25, 40, 0.55); 
            --text-main: #eaeef2; 
            --text-muted: #9aa9c0; 
            --border: rgba(0, 255, 200, 0.25); 
            --accent: #00ffc3; 
        }

        /* ЦВЕТА ДЛЯ МЯГКОЙ СВЕТЛОЙ ТЕМЫ */
        body.light-theme {
            --bg-color: #e8ecef;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2d3748;
            --text-muted: #4a5568;
            --border: rgba(0, 180, 140, 0.3);
        }

        body { background: var(--bg-color); background-image: radial-gradient(circle at 20% 30%, rgba(0, 255, 200, 0.05) 0%, transparent 30%), radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.05) 0%, transparent 35%); min-height: 100vh; display: flex; flex-direction: column; color: var(--text-main); padding: 2rem 1.5rem; position: relative; transition: background 0.3s ease, color 0.3s ease; }
        body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(0, 255, 200, 0.1), transparent 40%), radial-gradient(circle at 70% 80%, rgba(255, 0, 200, 0.1), transparent 40%); pointer-events: none; z-index: 0; }
        .wrapper { max-width: 1200px; margin: 0 auto; width: 100%; position: relative; z-index: 2; }
        
        /* ШАПКА */
        header { text-align: center; margin-bottom: 3rem; animation: fadeSlide 0.8s ease-out; }
        h1 { font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, #00ffc3, #4d6aff, #b300ff, #ff3b6f); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0, 255, 200, 0.3); margin-bottom: 0.75rem; line-height: 1.2; }
        
        .tagline { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; backdrop-filter: blur(2px); display: inline-block; padding: 0.3rem 1.5rem; border-radius: 60px; border: 1px solid rgba(0, 255, 200, 0.2); background: rgba(10, 20, 30, 0.4); box-shadow: 0 0 15px rgba(0, 255, 200, 0.1); margin-bottom: 2rem; transition: all 0.3s ease; }
        body.light-theme .tagline { background: rgba(255, 255, 255, 0.6); border-color: rgba(0, 180, 140, 0.3); }
        
        /* МЕНЮ */
        .nav-menu { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .nav-link { color: var(--text-main); text-decoration: none; font-size: 1.1rem; font-weight: 600; padding: 0.6rem 1.5rem; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); transition: all 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: #0b0e1a; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 20px rgba(0, 255, 200, 0.4); }
        body.light-theme .nav-link { border-color: rgba(0, 0, 0, 0.1); background: rgba(0, 0, 0, 0.05); }
        body.light-theme .nav-link.active { color: #ffffff; background: #00b38a; border-color: #00b38a; }

        /* СЕТКА */
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 2rem; padding: 2rem 1.5rem; border: 1.5px solid var(--border); box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 255, 200, 0.1) inset, 0 0 30px rgba(0, 200, 255, 0.1); transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), border-color 0.25s ease, box-shadow 0.3s ease, background 0.3s ease; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; position: relative; overflow: hidden; opacity: 0; animation: cardAppear 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; will-change: transform; }
        
        body.light-theme .card { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 180, 140, 0.15) inset; border: 1.5px solid rgba(0, 0, 0, 0.15); }
        body.light-theme .card:hover { background: #ffffff; border-color: #00b38a; box-shadow: 0 20px 40px -10px rgba(0, 180, 140, 0.3), 0 0 0 1.5px #00b38a inset; }

        .card:nth-child(1) { border-image: linear-gradient(145deg, #00ffc3, #4d6aff) 1; border-image-slice: 1; }
        .card:nth-child(2) { border-image: linear-gradient(145deg, #b300ff, #ff3b6f) 1; border-image-slice: 1; }
        .card:nth-child(3) { border-image: linear-gradient(145deg, #ff3b6f, #4d6aff) 1; border-image-slice: 1; }
        .card:nth-child(4) { border-image: linear-gradient(145deg, #00ffc3, #b300ff) 1; border-image-slice: 1; }
        .card:nth-child(5) { border-image: linear-gradient(145deg, #4d6aff, #ff3b6f) 1; border-image-slice: 1; }
        .card:nth-child(6) { border-image: linear-gradient(145deg, #b300ff, #00ffc3) 1; border-image-slice: 1; }
        .card:nth-child(7) { border-image: linear-gradient(145deg, #ff3b6f, #00ffc3) 1; border-image-slice: 1; }
        .card:nth-child(8) { border-image: linear-gradient(145deg, #4d6aff, #b300ff) 1; border-image-slice: 1; }
        
        .card:not(:nth-child(9)):hover { transform: translateY(-10px) scale(1.02); background: rgba(20, 30, 50, 0.75); }
        body.light-theme .card:not(:nth-child(9)):hover { background: #ffffff; }
        
        .card:nth-child(1):hover, .card:nth-child(4):hover { border-color: #00ffc3; box-shadow: 0 25px 50px -12px #00ffc3, 0 0 0 1.5px #00ffc3 inset, 0 0 60px rgba(0, 255, 200, 0.45); }
        .card:nth-child(2):hover, .card:nth-child(6):hover { border-color: #b300ff; box-shadow: 0 25px 50px -12px #b300ff, 0 0 0 1.5px #b300ff inset, 0 0 60px rgba(180, 0, 255, 0.5); }
        .card:nth-child(3):hover, .card:nth-child(7):hover { border-color: #ff3b6f; box-shadow: 0 25px 50px -12px #ff3b6f, 0 0 0 1.5px #ff3b6f inset, 0 0 60px rgba(255, 59, 111, 0.5); }
        .card:nth-child(5):hover, .card:nth-child(8):hover { border-color: #4d6aff; box-shadow: 0 25px 50px -12px #4d6aff, 0 0 0 1.5px #4d6aff inset, 0 0 60px rgba(77, 106, 255, 0.5); }

        .card:hover .card-icon { animation: iconPulse 1.2s ease-in-out infinite; }
        @keyframes iconPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(0, 255, 200, 0.9)); } 50% { transform: scale(1.15); filter: drop-shadow(0 0 24px rgba(0, 255, 200, 1)); } }
        
        .card::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.15), transparent); transition: left 0.6s ease; pointer-events: none; }
        .card:hover::after { left: 100%; }

        .card-icon { font-size: 3.2rem; line-height: 1; margin-bottom: 1rem; filter: drop-shadow(0 0 12px rgba(0, 255, 200, 0.7)); transition: transform 0.3s ease, filter 0.3s ease; }
        
        .card h2 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.01em; background: linear-gradient(135deg, #ffffff, #b0e0ff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.65rem; }
        body.light-theme .card h2 { background: linear-gradient(135deg, #1a202c, #2d3748); -webkit-background-clip: text; background-clip: text; }
        
        .card p { color: var(--text-muted); font-size: 1rem; line-height: 1.5; font-weight: 400; opacity: 0.9; }
        
        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 5, 15, 0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: rgba(15, 22, 38, 0.92); backdrop-filter: blur(20px); border: 1.5px solid rgba(0, 255, 200, 0.4); border-radius: 2.5rem; max-width: 900px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 2.5rem 2rem; box-shadow: 0 0 80px rgba(0, 255, 200, 0.3), 0 0 30px rgba(180, 0, 255, 0.3); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1); position: relative; scrollbar-width: thin; scrollbar-color: #00ffc3 #1a2235; color: var(--text-main); }
        .modal-overlay.active .modal-content { transform: scale(1); }
        body.light-theme .modal-content { background: rgba(255, 255, 255, 0.98); border-color: rgba(0, 180, 140, 0.4); }
        
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: #1a2235; border-radius: 20px; }
        .modal-content::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #00ffc3, #b300ff); border-radius: 20px; }
        
        .modal-close { position: absolute; top: 1.2rem; right: 1.5rem; background: none; border: none; font-size: 2.2rem; line-height: 1; color: var(--text-muted); cursor: pointer; transition: color 0.2s, transform 0.2s; z-index: 10; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); }
        .modal-close:hover { color: #00ffc3; transform: rotate(90deg); border-color: #00ffc3; }
        
        .modal-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 1.5rem; background: linear-gradient(135deg, #00ffc3, #b300ff); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 2rem; }
        body.light-theme .modal-title { background: linear-gradient(135deg, #00b38a, #7c00b3); -webkit-background-clip: text; background-clip: text; }
        
        /* СТИЛИ ДЛЯ ТУТОРИАЛОВ ВНУТРИ МОДАЛКИ */
        .tutorial-step { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 255, 200, 0.15); border-radius: 1.5rem; padding: 1.4rem 1.6rem; margin-bottom: 1.2rem; }
        body.light-theme .tutorial-step { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.06); }
        
        .tutorial-step h3 { font-size: 1.3rem; color: #fff; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        body.light-theme .tutorial-step h3 { color: #1a202c; }
        
        .tutorial-step p { color: #b6c8e0; font-size: 0.95rem; line-height: 1.55; margin: 0.5rem 0; }
        body.light-theme .tutorial-step p { color: #4a5568; }
        
        .tutorial-step ol { margin-left: 1.5rem; color: #b6c8e0; font-size: 0.95rem; line-height: 1.6; }
        body.light-theme .tutorial-step ol { color: #4a5568; }
        
        .tutorial-step li { margin-bottom: 0.5rem; }
        .tutorial-step strong { color: #fff; }
        body.light-theme .tutorial-step strong { color: #1a202c; }
        
        .tip-box { background: rgba(0, 255, 200, 0.1); border-left: 4px solid #00ffc3; padding: 1rem; border-radius: 0 10px 10px 0; margin-top: 1rem; font-size: 0.95rem; color: #00ffc3; }
        body.light-theme .tip-box { background: rgba(0, 180, 140, 0.1); color: #00b38a; border-color: #00b38a; }
        
        .tools-list { margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; }
        body.light-theme .tools-list { border-color: rgba(0,0,0,0.1); }
        
        .tools-list h4 { font-size: 1.2rem; color: #fff; margin-bottom: 1rem; }
        body.light-theme .tools-list h4 { color: #1a202c; }
        
        @keyframes cardAppear { 0% { opacity: 0; transform: translateY(30px) scale(0.97); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .glow-line { height: 2px; width: 100%; background: linear-gradient(90deg, transparent, #00ffc3, #b300ff, #ff3b6f, transparent); margin-top: 2rem; opacity: 0.3; border-radius: 10px; }

        /* Кнопки управления в шапке */
        .top-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        
        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            text-decoration: none;
            color: var(--text-main);
        }
        .nav-btn:hover {
            transform: scale(1.1) rotate(15deg);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.3);
        }
        body.light-theme .nav-btn {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
        }
        body.light-theme .nav-btn:hover {
            border-color: #00b38a;
            box-shadow: 0 0 15px rgba(0, 179, 138, 0.3);
        }

        @media (max-width: 700px) {
            body { padding: 1.5rem 1rem; }
            .catalog-grid { gap: 1.5rem; }
            .card { padding: 1.6rem 1.3rem; border-radius: 1.8rem; }
            .card h2 { font-size: 1.6rem; }
            .modal-content { padding: 2rem 1.3rem; border-radius: 2rem; }
            .modal-title { font-size: 1.8rem; margin-bottom: 1.5rem; }
            .tutorial-step { padding: 1.1rem 1.2rem; }
            .top-controls { top: 0.5rem; right: 0.5rem; }
        }
        @media (max-width: 450px) {
            .card { padding: 1.4rem 1.2rem; }
            .card-icon { font-size: 2.6rem; }
            .tagline { font-size: 1rem; }
            .modal-close { top: 0.8rem; right: 1rem; font-size: 1.8rem; width: 38px; height: 38px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="top-controls">
            <a href="start.html" class="nav-btn" title="На главную">🏠</a>
            <button id="themeToggle" class="nav-btn" title="Переключить тему">🌙</button>
        </div>
        
        <header>
            <h1>NEON TUTORIALS</h1>
            <div class="tagline">Короткие и четкие инструкции</div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Каталог</a>
                <a href="tutorials.html" class="nav-link active">Туториалы</a>
                <a href="prompts.html" class="nav-link">Промпты</a>
            </nav>
        </header>

        <main>
            <div id="catalogGrid" class="catalog-grid"></div>
            <div class="glow-line"></div>
        </main>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // --- ЛОГИКА СВЕТЛОЙ/ТЕМНОЙ ТЕМЫ ---
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            if (themeToggle) themeToggle.textContent = '☀️';
        }
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light-theme');
                if (document.body.classList.contains('light-theme')) {
                    themeToggle.textContent = '☀️';
                    localStorage.setItem('theme', 'light');
                } else {
                    themeToggle.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        // ДАННЫЕ ТУТОРИАЛОВ
        const tutorials = [
            {
                icon: '🎨', title: 'Генерация картинок', description: 'Нюансы и хитрости работы с нейросетями для визуала.',
                tutorial: null,
                tools: [
                    { name: 'Leonardo AI', url: 'https://leonardo.ai', note: 'Токены обновляются раз в сутки. Если хотите сэкономить — генерируйте по 1 картинке за раз, а не по 4.' },
                    { name: 'Ideogram', url: 'https://ideogram.ai', note: 'Лучше всех пишет текст на русском и английском. Всегда берите слова в кавычки в промпте.' },
                    { name: 'Recraft', url: 'https://recraft.ai', note: 'Используйте, если нужен логотип в векторе (SVG), который потом можно отдать в печать или отредактировать в Illustrator.' },
                    { name: 'Krea AI', url: 'https://krea.ai', note: 'Незаменим для апскейла (увеличения) старых фото. Если генерация выдает «кашу», попробуйте снизить Creativity.' }
                ]
            },
            {
                icon: '⚡', title: 'Вайбкодинг', description: 'Как писать код словами и не сломать себе мозг.',
                tutorial: null,
                tools: [
                    { name: 'Cursor', url: 'https://cursor.com', note: 'Если ИИ выдал ошибку, не пытайтесь исправить её руками. Просто напишите в чат: «Выдает ошибку, вот текст (вставьте), исправь».' },
                    { name: 'v0.dev', url: 'https://v0.dev', note: 'Загружайте скриншоты не целых сайтов, а отдельных блоков (например, только меню или карточку товара). Так точнее.' },
                    { name: 'Replit', url: 'https://replit.com', note: 'Сайт «засыпает», если его долго не открывать. Зайдите в панель управления и нажмите кнопку перезапуска.' },
                    { name: 'DeepSeek', url: 'https://chat.deepseek.com', note: 'Идеален для написания простых скриптов на Python. Просите его писать код с комментариями на русском.' }
                ]
            },
            {
                icon: '📝', title: 'Копирайтинг и редактура', description: 'Как заставить ИИ писать как человек, а не как робот.',
                tutorial: null,
                tools: [
                    { name: 'ChatGPT', url: 'https://chat.openai.com', note: 'Главный секрет: просите его «переписать текст в стиле стендап-комика» или «в стиле строгого редактора». Меняйте роль.' },
                    { name: 'Claude', url: 'https://claude.ai', note: 'Давайте ему на вход сразу 5-10 примеров ваших текстов, чтобы он понял ваш стиль. Он отлично чувствует тон.' },
                    { name: 'Notion AI', url: 'https://www.notion.so/product/ai', note: 'Выделите любой текст и нажмите пробел — появится меню «Попросить ИИ». Удобно для быстрой правки прямо на месте.' }
                ]
            },
            {
                icon: '💼', title: 'Продажи, CRM, автоматизация', description: 'Избавляемся от ручной переписки и теряющихся клиентов.',
                tutorial: `
                    <ol>
                        <li><strong>Шаг 1: Сбор базы.</strong> Настройте простую форму (например, в Google Forms), чтобы клиент оставлял имя и телефон.</li>
                        <li><strong>Шаг 2: Таблица.</strong> Ответы из формы пусть автоматически падают в таблицу Google Sheets. Это ваша база клиентов.</li>
                        <li><strong>Шаг 3: Автоответ.</strong> Свяжите таблицу с Telegram-ботом (через Albato или Zapier). Как только клиент заполнил форму — бот сразу пишет ему: «Здравствуйте, [Имя], я получил вашу заявку».</li>
                        <li><strong>Шаг 4: Напоминания.</strong> Настройте автоматическое письмо, если клиент не отвечает 2 дня.</li>
                    </ol>
                    <div class="tip-box">💡 Для малого бизнеса (как продажа украшений) хватит связки: <strong>Tilda (форма) → Google Sheets → Telegram</strong>.</div>
                `,
                tools: [
                    { name: 'Tidio', url: 'https://www.tidio.com', note: 'Бесплатной версии хватит, чтобы поставить чат-бот на сайт и отвечать на частые вопросы.' },
                    { name: 'ManyChat', url: 'https://manychat.com', note: 'Лучший инструмент для Instagram. Настройте автоответ на комментарий «Цена» — бот пришлет в личку прайс.' },
                    { name: 'Make', url: 'https://www.make.com', note: 'Более дешевая альтернатива Zapier. Визуально выглядит как блок-схема, очень понятен новичкам.' }
                ]
            },
            {
                icon: '📊', title: 'Анализ данных и таблицы', description: 'Как заставить ИИ сделать отчет по вашим продажам.',
                tutorial: `
                    <ol>
                        <li><strong>Шаг 1:</strong> Выгрузите ваши продажи или таблицу с клиентами в формате <strong>.xlsx (Excel)</strong> или <strong>.csv</strong>.</li>
                        <li><strong>Шаг 2:</strong> Откройте ChatGPT (нужна версия GPT-4o) или Gemini.</li>
                        <li><strong>Шаг 3:</strong> Нажмите на скрепку и прикрепите файл.</li>
                        <li><strong>Шаг 4:</strong> Напишите промпт: «Проанализируй эту таблицу. Какая категория товаров приносит больше всего выручки? Построй график продаж по месяцам. Сделай выводы».</li>
                    </ol>
                    <div class="tip-box">💡 Совет: Если таблица огромная, перед загрузкой удалите лишние столбцы (например, с адресами), оставьте только даты, суммы и названия.</div>
                `,
                tools: [
                    { name: 'Julius AI', url: 'https://julius.ai', note: 'Заточен именно под таблицы. Умеет строить красивые графики, которые можно скачать в PDF.' },
                    { name: 'Rows AI', url: 'https://rows.com', note: 'Это как Google Таблицы, но с ИИ. Попросите его написать формулу, и он сделает это сам.' }
                ]
            },
            {
                icon: '🧩', title: 'No-code / автоматизации', description: 'Как соединить две программы, чтобы они работали сами.',
                tutorial: `
                    <ol>
                        <li><strong>Шаг 1:</strong> Поймите, что вы хотите автоматизировать. (Например: «Когда приходит письмо с темой 'Заказ', скинуть его в мой Telegram»).</li>
                        <li><strong>Шаг 2:</strong> Зарегистрируйтесь в Make (или Zapier).</li>
                        <li><strong>Шаг 3:</strong> Выберите первое действие (Триггер) — например, Gmail: "Новое письмо".</li>
                        <li><strong>Шаг 4:</strong> Выберите второе действие — Telegram: "Отправить сообщение".</li>
                        <li><strong>Шаг 5:</strong> Свяжите их (авторизуйте доступ). Нажмите «Тест».</li>
                    </ol>
                    <div class="tip-box">💡 В Make есть готовые шаблоны (Templates). Не пишите с нуля — найдите готовый шаблон и просто поменяйте настройки под себя.</div>
                `,
                tools: [
                    { name: 'Zapier', url: 'https://zapier.com', note: 'Самый простой интерфейс. Если вы никогда не делали автоматизаций — начинайте с него.' },
                    { name: 'Make', url: 'https://www.make.com', note: 'Дает больше бесплатных операций. Но интерфейс чуть сложнее, нужно разобраться.' },
                    { name: 'n8n', url: 'https://n8n.io', note: 'Только для продвинутых. Его нужно устанавливать на сервер, зато полностью бесплатно.' }
                ]
            },
            {
                icon: '🧠', title: 'Обучение и объяснение', description: 'Как быстро делать конспекты и готовиться к экзаменам.',
                tutorial: `
                    <ol>
                        <li><strong>Шаг 1:</strong> Скачайте лекцию или учебник в PDF.</li>
                        <li><strong>Шаг 2:</strong> Загрузите файл в NotebookLM (от Google) или Claude.</li>
                        <li><strong>Шаг 3:</strong> Попросите: «Сделай краткий конспект по главе 3. Выдели 5 главных мыслей. Составь 10 вопросов для самопроверки».</li>
                        <li><strong>Шаг 4:</strong> Используйте режим «Подкаст» в NotebookLM, чтобы прослушать материал по дороге домой.</li>
                    </ol>
                    <div class="tip-box">💡 Никогда не просите ИИ просто «объяснить тему». Просите: «Объясни эту тему, как будто мне 10 лет, используя аналогии из жизни».</div>
                `,
                tools: [
                    { name: 'NotebookLM', url: 'https://notebooklm.google.com', note: 'Генерирует конспекты и даже аудиоподкасты на основе ваших файлов. Работает без галлюцинаций.' },
                    { name: 'Perplexity', url: 'https://www.perplexity.ai', note: 'Используйте, когда нужно найти информацию в интернете и сразу получить ссылки на источники.' }
                ]
            },
            {
                icon: '🖼️', title: 'Работа с фото', description: 'Быстрая ретушь и подготовка карточек товаров.',
                tutorial: null,
                tools: [
                    { name: 'Remove.bg', url: 'https://www.remove.bg', note: 'Скачивайте картинку в высоком разрешении для маркетплейсов, иначе фото будет мыльным.' },
                    { name: 'Photoroom', url: 'https://www.photoroom.com', note: 'В мобильном приложении есть функция «тени» и «отражения». Фото товара сразу выглядит дорого.' },
                    { name: 'Krea AI', url: 'https://krea.ai', note: 'Если фото с телефона темное или размытое, загрузите его в Krea и нажмите Enhance.' }
                ]
            }
        ];

        const grid = document.getElementById('catalogGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalClose');

        function renderTutorials() {
            if (!grid) return;
            grid.innerHTML = '';

            tutorials.forEach((tut, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <div class="card-icon">${tut.icon}</div>
                    <h2>${tut.title}</h2>
                    <p>${tut.description}</p>
                `;

                card.addEventListener('click', () => openTutorialModal(tut));
                grid.appendChild(card);
            });
        }

        function openTutorialModal(tut) {
            let contentHTML = `<div class="modal-title">${tut.icon} ${tut.title}</div>`;

            if (tut.tutorial) {
                contentHTML += `
                    <div class="tutorial-step">
                        <h3>🚀 Краткий туториал</h3>
                        <div style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-top: 10px;">${tut.tutorial}</div>
                    </div>
                `;
            }

            if (tut.tools && tut.tools.length > 0) {
                contentHTML += `<div class="tools-list"><h4>🛠️ Инструменты и нюансы:</h4>`;
                
                tut.tools.forEach(item => {
                    const url = item.url.startsWith('http') ? item.url : `https://${item.url}`;
                    contentHTML += `
                        <div class="tutorial-step" style="margin-bottom: 1rem; padding: 1rem;">
                            <h3 style="font-size: 1.1rem; margin-bottom: 0.3rem;">
                                ${item.name} 
                                <a href="${url}" target="_blank" style="color: #4d9eff; text-decoration: none; font-size: 0.8rem; border: 1px solid #4d9eff; padding: 0.1rem 0.5rem; border-radius: 20px; margin-left: 10px;">Сайт ↗</a>
                            </h3>
                            <p style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">${item.note}</p>
                        </div>
                    `;
                });
                contentHTML += `</div>`;
            }

            modalBody.innerHTML = contentHTML;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        if (modalClose) {
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });
        }

        renderTutorials();
    </script>
</body>
</html>
