<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON CATALOG · Промпты</title>
    <style>
        /* БАЗОВЫЕ СТИЛИ */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        /* ЦВЕТА ДЛЯ ТЕМНОЙ ТЕМЫ */
        :root { --bg-color: #0b0e1a; --card-bg: rgba(18, 25, 40, 0.55); --text-main: #eaeef2; --text-muted: #9aa9c0; --border: rgba(0, 255, 200, 0.25); --accent: #00ffc3; }
        
        /* ЦВЕТА ДЛЯ МЯГКОЙ СВЕТЛОЙ ТЕМЫ */
        body.light-theme { --bg-color: #e8ecef; --card-bg: rgba(255, 255, 255, 0.95); --text-main: #2d3748; --text-muted: #4a5568; --border: rgba(0, 180, 140, 0.3); }
        
        body { background: var(--bg-color); background-image: radial-gradient(circle at 20% 30%, rgba(0, 255, 200, 0.05) 0%, transparent 30%), radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.05) 0%, transparent 35%); min-height: 100vh; display: flex; flex-direction: column; color: var(--text-main); padding: 2rem 1.5rem; position: relative; transition: background 0.3s ease, color 0.3s ease; }
        body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(0, 255, 200, 0.1), transparent 40%), radial-gradient(circle at 70% 80%, rgba(255, 0, 200, 0.1), transparent 40%); pointer-events: none; z-index: 0; }
        .wrapper { max-width: 1200px; margin: 0 auto; width: 100%; position: relative; z-index: 2; }
        header { text-align: center; margin-bottom: 3rem; animation: fadeSlide 0.8s ease-out; }
        h1 { font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, #00ffc3, #4d6aff, #b300ff, #ff3b6f); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0, 255, 200, 0.3); margin-bottom: 0.75rem; line-height: 1.2; }
        .tagline { font-size: 1.2rem; color: var(--text-muted); font-weight: 400; letter-spacing: 0.5px; backdrop-filter: blur(2px); display: inline-block; padding: 0.3rem 1.5rem; border-radius: 60px; border: 1px solid rgba(0, 255, 200, 0.2); background: rgba(10, 20, 30, 0.4); box-shadow: 0 0 15px rgba(0, 255, 200, 0.1); margin-bottom: 2rem; transition: all 0.3s ease; }
        body.light-theme .tagline { background: rgba(255, 255, 255, 0.6); border-color: rgba(0, 180, 140, 0.3); }
        
        .nav-menu { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .nav-link { color: var(--text-main); text-decoration: none; font-size: 1.1rem; font-weight: 600; padding: 0.6rem 1.5rem; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); transition: all 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: #0b0e1a; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 20px rgba(0, 255, 200, 0.4); }
        body.light-theme .nav-link { border-color: rgba(0, 0, 0, 0.1); background: rgba(0, 0, 0, 0.05); }
        body.light-theme .nav-link.active { color: #ffffff; background: #00b38a; border-color: #00b38a; }
        
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 2rem; padding: 2rem 1.5rem; border: 1.5px solid var(--border); box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 255, 200, 0.1) inset, 0 0 30px rgba(0, 200, 255, 0.1); transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), border-color 0.25s ease, box-shadow 0.3s ease, background 0.3s ease; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; position: relative; overflow: hidden; opacity: 0; animation: cardAppear 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; will-change: transform; }
        body.light-theme .card { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 180, 140, 0.15) inset; border: 1.5px solid rgba(0, 0, 0, 0.15); }
        body.light-theme .card:hover { background: #ffffff; border-color: #00b38a; box-shadow: 0 20px 40px -10px rgba(0, 180, 140, 0.3), 0 0 0 1.5px #00b38a inset; }
        
        .card:nth-child(1) { border-image: linear-gradient(145deg, #00ffc3, #4d6aff) 1; border-image-slice: 1; }
        .card:nth-child(2) { border-image: linear-gradient(145deg, #b300ff, #ff3b6f) 1; border-image-slice: 1; }
        .card:nth-child(3) { border-image: linear-gradient(145deg, #ff3b6f, #4d6aff) 1; border-image-slice: 1; }
        .card:nth-child(4) { border-image: linear-gradient(145deg, #00ffc3, #b300ff) 1; border-image-slice: 1; }
        .card:nth-child(5) { border-image: linear-gradient(145deg, #4d6aff, #ff3b6f) 1; border-image-slice: 1; }
        .card:nth-child(6) { border-image: linear-gradient(145deg, #b300ff, #00ffc3) 1; border-image-slice: 1; }
        .card:nth-child(7) { border-image: linear-gradient(145deg, #ff3b6f, #00ffc3) 1; border-image-slice: 1; }
        .card:nth-child(8) { border-image: linear-gradient(145deg, #4d6aff, #b300ff) 1; border-image-slice: 1; }
        
        .card:not(:nth-child(9)):hover { transform: translateY(-10px) scale(1.02); background: rgba(20, 30, 50, 0.75); }
        body.light-theme .card:not(:nth-child(9)):hover { background: #ffffff; }
        
        .card:nth-child(1):hover, .card:nth-child(4):hover { border-color: #00ffc3; box-shadow: 0 25px 50px -12px #00ffc3, 0 0 0 1.5px #00ffc3 inset, 0 0 60px rgba(0, 255, 200, 0.45); }
        .card:nth-child(2):hover, .card:nth-child(6):hover { border-color: #b300ff; box-shadow: 0 25px 50px -12px #b300ff, 0 0 0 1.5px #b300ff inset, 0 0 60px rgba(180, 0, 255, 0.5); }
        .card:nth-child(3):hover, .card:nth-child(7):hover { border-color: #ff3b6f; box-shadow: 0 25px 50px -12px #ff3b6f, 0 0 0 1.5px #ff3b6f inset, 0 0 60px rgba(255, 59, 111, 0.5); }
        .card:nth-child(5):hover, .card:nth-child(8):hover { border-color: #4d6aff; box-shadow: 0 25px 50px -12px #4d6aff, 0 0 0 1.5px #4d6aff inset, 0 0 60px rgba(77, 106, 255, 0.5); }
        
        .card:hover .card-icon { animation: iconPulse 1.2s ease-in-out infinite; }
        @keyframes iconPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(0, 255, 200, 0.9)); } 50% { transform: scale(1.15); filter: drop-shadow(0 0 24px rgba(0, 255, 200, 1)); } }
        .card::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.15), transparent); transition: left 0.6s ease; pointer-events: none; }
        .card:hover::after { left: 100%; }
        .card-icon { font-size: 3.2rem; line-height: 1; margin-bottom: 1rem; filter: drop-shadow(0 0 12px rgba(0, 255, 200, 0.7)); transition: transform 0.3s ease, filter 0.3s ease; }
        
        .card h2 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.01em; background: linear-gradient(135deg, #ffffff, #b0e0ff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.65rem; }
        body.light-theme .card h2 { background: linear-gradient(135deg, #1a202c, #2d3748); -webkit-background-clip: text; background-clip: text; }
        .card p { color: var(--text-muted); font-size: 1rem; line-height: 1.5; font-weight: 400; opacity: 0.9; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 5, 15, 0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: rgba(15, 22, 38, 0.92); backdrop-filter: blur(20px); border: 1.5px solid rgba(0, 255, 200, 0.4); border-radius: 2.5rem; max-width: 900px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 2.5rem 2rem; box-shadow: 0 0 80px rgba(0, 255, 200, 0.3), 0 0 30px rgba(180, 0, 255, 0.3); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1); position: relative; scrollbar-width: thin; scrollbar-color: #00ffc3 #1a2235; color: var(--text-main); }
        .modal-overlay.active .modal-content { transform: scale(1); }
        body.light-theme .modal-content { background: rgba(255, 255, 255, 0.98); border-color: rgba(0, 180, 140, 0.4); }
        
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: #1a2235; border-radius: 20px; }
        .modal-content::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #00ffc3, #b300ff); border-radius: 20px; }
        
        .modal-close { position: absolute; top: 1.2rem; right: 1.5rem; background: none; border: none; font-size: 2.2rem; line-height: 1; color: var(--text-muted); cursor: pointer; transition: color 0.2s, transform 0.2s; z-index: 10; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); }
        .modal-close:hover { color: #00ffc3; transform: rotate(90deg); border-color: #00ffc3; }
        
        .modal-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 1.5rem; background: linear-gradient(135deg, #00ffc3, #b300ff); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 2rem; }
        body.light-theme .modal-title { background: linear-gradient(135deg, #00b38a, #7c00b3); -webkit-background-clip: text; background-clip: text; }
        
        .prompt-block { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 255, 200, 0.15); border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; position: relative; }
        body.light-theme .prompt-block { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.06); }
        .prompt-block h3 { font-size: 1.2rem; color: #fff; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        body.light-theme .prompt-block h3 { color: #1a202c; }
        
        .best-tool-link { display: inline-block; font-size: 0.9rem; color: #4d9eff; text-decoration: none; margin-bottom: 1rem; font-weight: 600; padding: 0.2rem 0.8rem; border: 1px solid rgba(77, 158, 255, 0.3); border-radius: 20px; background: rgba(77, 158, 255, 0.05); transition: all 0.2s; }
        .best-tool-link:hover { background: rgba(77, 158, 255, 0.2); border-color: #4d9eff; box-shadow: 0 0 10px rgba(77, 158, 255, 0.3); }
        
        .prompt-text { background: rgba(0, 0, 0, 0.3); padding: 1rem; border-radius: 10px; border-left: 3px solid #00ffc3; font-family: monospace; font-size: 0.95rem; color: #eaeef2; line-height: 1.5; white-space: pre-wrap; margin-bottom: 1rem; transition: all 0.3s ease; }
        body.light-theme .prompt-text { background: rgba(255, 255, 255, 0.9); color: #1a202c; border-left-color: #00b38a; }
        
        .copy-btn { background: rgba(0, 255, 200, 0.1); border: 1px solid #00ffc3; color: #00ffc3; padding: 0.5rem 1rem; border-radius: 30px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .copy-btn:hover { background: #00ffc3; color: #0b0e1a; box-shadow: 0 0 15px rgba(0, 255, 200, 0.4); }
        .copy-btn.copied { background: #00ffc3; color: #0b0e1a; }
        
        @keyframes cardAppear { 0% { opacity: 0; transform: translateY(30px) scale(0.97); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
        .glow-line { height: 2px; width: 100%; background: linear-gradient(90deg, transparent, #00ffc3, #b300ff, #ff3b6f, transparent); margin-top: 2rem; opacity: 0.3; border-radius: 10px; }
        
        /* Кнопки управления в шапке */
        .top-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        
        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            text-decoration: none;
            color: var(--text-main);
        }
        .nav-btn:hover {
            transform: scale(1.1) rotate(15deg);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.3);
        }
        body.light-theme .nav-btn {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
        }
        body.light-theme .nav-btn:hover {
            border-color: #00b38a;
            box-shadow: 0 0 15px rgba(0, 179, 138, 0.3);
        }
        
        @media (max-width: 700px) {
            body { padding: 1.5rem 1rem; }
            .catalog-grid { gap: 1.5rem; }
            .card { padding: 1.6rem 1.3rem; border-radius: 1.8rem; }
            .card h2 { font-size: 1.6rem; }
            .modal-content { padding: 2rem 1.3rem; border-radius: 2rem; }
            .modal-title { font-size: 1.8rem; margin-bottom: 1.5rem; }
            .top-controls { top: 0.5rem; right: 0.5rem; }
        }
        @media (max-width: 450px) {
            .card { padding: 1.4rem 1.2rem; }
            .card-icon { font-size: 2.6rem; }
            .tagline { font-size: 1rem; }
            .modal-close { top: 0.8rem; right: 1rem; font-size: 1.8rem; width: 38px; height: 38px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="top-controls">
            <a href="start.html" class="nav-btn" title="На главную">🏠</a>
            <button id="themeToggle" class="nav-btn" title="Переключить тему">🌙</button>
        </div>
        
        <header>
            <h1>NEON PROMPTS</h1>
            <div class="tagline">Готовые промпты для ИИ</div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Каталог</a>
                <a href="tutorials.html" class="nav-link">Туториалы</a>
                <a href="prompts.html" class="nav-link active">Промпты</a>
            </nav>
        </header>

        <main>
            <div id="catalogGrid" class="catalog-grid"></div>
            <div class="glow-line"></div>
        </main>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ЛОГИКА ТЕМЫ
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            if (themeToggle) themeToggle.textContent = '☀️';
        }
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light-theme');
                if (document.body.classList.contains('light-theme')) {
                    themeToggle.textContent = '☀️';
                    localStorage.setItem('theme', 'light');
                } else {
                    themeToggle.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        // ДАННЫЕ ПРОМПТОВ
        const promptsData = [            { icon: '🎨', title: 'Генерация картинок', description: 'Промпты для Leonardo, Midjourney, Ideogram и других.', prompts: [
                { title: '📸 Фотореалистичный портрет', bestTool: 'Midjourney', bestToolUrl: 'https://www.midjourney.com', text: 'Close-up portrait of a [возраст] [пол] with [цвет] hair, wearing [одежда], [эмоция] expression. Cinematic lighting, soft shadows, 85mm lens, f/1.8, ultra-realistic, 8k, highly detailed skin texture, photorealistic, masterpiece.', uaText: 'Портрет крупним планом [вік] [стать] з [колір] волоссям, в [одяг], вираз [емоція]. Кінематографічне освітлення, м\'які тіні, об\'єктив 85mm, f/1.8, ультрареалістичність, 8k, високодеталізована текстура шкіри, фотореалізм, шедевр.' },
                { title: '✨ Логотип с текстом', bestTool: 'Ideogram', bestToolUrl: 'https://ideogram.ai', text: 'A minimalist vector logo for a [сфера бизнеса] company named "[Название]". The design features [элемент, например: a stylized cup] and the text "[Название]" in a bold, modern sans-serif font. White background, flat design, clean lines, high contrast, professional branding.', uaText: 'Мінімалістичний векторний логотип для компанії у сфері [сфера бізнесу] під назвою "[Назва]". Дизайн містить [елемент, наприклад: стилізовану чашку] та текст "[Назва]" жирним, сучасним шрифтом без зарубок. Білий фон, плоский дизайн, чисті лінії, високий контраст, професійний брендинг.' },
                { title: '🎨 3D-персонаж в стиле Pixar', bestTool: 'Leonardo AI', bestToolUrl: 'https://leonardo.ai', text: 'A cute 3D character of a [кто это, например: маленький дракон], Pixar animation style, big expressive eyes, soft lighting, highly detailed, vibrant colors, standing in a magical forest, 8k resolution, octane render, trending on ArtStation.', uaText: 'Милий 3D-персонаж [хто це, наприклад: маленький дракон], стиль анімації Pixar, великі виразні очі, м\'яке освітлення, висока деталізація, яскраві кольори, стоїть у чарівному лісі, роздільна здатність 8k, рендер octane, популярне на ArtStation.' },
                { title: '🖼️ Интерьер в скандинавском стиле', bestTool: 'Krea AI', bestToolUrl: 'https://krea.ai', text: 'Interior design of a modern living room, scandinavian style, large windows with natural light, wooden floor, minimalist furniture, cozy atmosphere, indoor plants, highly detailed, photorealistic, architectural photography, 4k.', uaText: 'Дизайн інтер\'єру сучасної вітальні, скандинавський стиль, великі вікна з природним світлом, дерев\'яна підлога, мінімалістичні меблі, затишна атмосфера, кімнатні рослини, висока деталізація, фотореалізм, архітектурна фотографія, 4k.' }
            ]},
            { icon: '⚡', title: 'Вайбкодинг', description: 'Создание сайтов, приложений и анализ файлов.', prompts: [
                { title: '💻 Создание сайта с нуля (HTML/CSS/JS)', bestTool: 'Cursor', bestToolUrl: 'https://cursor.com', text: 'Ты — senior frontend-разработчик. Напиши чистый, семантический и адаптивный код для одностраничного сайта. Тема сайта: [опиши тему, например: портфолио фотографа]. Стиль: [например: минимализм, тёмная тема, неоновые акценты]. Обязательно используй Flexbox или CSS Grid. Добавь плавные анимации при наведении. Весь CSS и JS напиши внутри одного файла HTML.', uaText: 'Ти — senior frontend-розробник. Напиши чистий, семантичний та адаптивний код для односторінкового сайту. Тема сайту: [опиши тему, наприклад: портфоліо фотографа]. Стиль: [наприклад: мінімалізм, темна тема, неонові акценти]. Обов\'язково використовуй Flexbox або CSS Grid. Додай плавні анімації при наведенні. Весь CSS та JS напиши всередині одного файлу HTML.' },
                { title: '🎨 Дизайн сайта по описанию', bestTool: 'v0.dev', bestToolUrl: 'https://v0.dev', text: 'Создай современный и стильный дизайн для [тип сайта, например: лендинг для кофейни]. Целевая аудитория: [опиши аудиторию]. Основные цвета: [цвета]. Сайт должен содержать следующие секции: шапка с меню, главный экран с кнопкой (Hero section), блок с преимуществами, галерея и футер. Используй Tailwind CSS для стилизации.', uaText: 'Створи сучасний та стильний дизайн для [тип сайту, наприклад: лендінг для кав\'ярні]. Цільова аудиторія: [опиши аудиторію]. Основні кольори: [кольори]. Сайт повинен містити наступні секції: шапка з меню, головний екран з кнопкою (Hero section), блок з перевагами, галерея та футер. Використовуй Tailwind CSS для стилізації.' },

                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <div class="card-icon">${item.icon}</div>
                    <h2>${item.title}</h2>
                    <p>${item.description}</p>
                `;

                card.addEventListener('click', () => openPromptModal(item));
                grid.appendChild(card);
            });
        }

        function openPromptModal(item) {
            let contentHTML = `<div class="modal-title">${item.icon} ${item.title}</div>`;

            if (!item.prompts || item.prompts.length === 0) {
                contentHTML += `<p style="color: #b6c8e0;">Промпты для этого раздела скоро появятся!</p>`;
            } else {
                item.prompts.forEach((p, i) => {
                    const uniqueId = `prompt-${item.title.replace(/\s+/g, '-')}-${i}`;
                    const toolHTML = p.bestTool ? `<a href="${p.bestToolUrl}" target="_blank" class="best-tool-link">➔ Лучший выбор: ${p.bestTool} ↗</a>` : '';
                    
                    const safeOrig = p.text.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const safeUa = (p.uaText || p.text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                    contentHTML += `
                        <div class="prompt-block">
                            <h3>✨ ${p.title}</h3>
                            ${toolHTML}
                            <div class="prompt-text" id="${uniqueId}" data-orig="${safeOrig}" data-ua="${safeUa}">${p.text}</div>
                            
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <button class="copy-btn" onclick="copyPrompt('${uniqueId}', this)">
                                    <span>📋 Скопировать</span>
                                </button>
                                ${p.uaText ? `
                                <button class="copy-btn ua-btn" onclick="toggleTranslate('${uniqueId}', this)">
                                    <span>🇺🇦 На украинском</span>
                                </button>` : ''}
                            </div>
                        </div>
                    `;
                });
            }

            modalBody.innerHTML = contentHTML;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        window.copyPrompt = function(elementId, btn) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span>✅ Скопировано!</span>';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        };

        window.toggleTranslate = function(elementId, btn) {
            const textEl = document.getElementById(elementId);
            const isUA = textEl.getAttribute('data-is-ua') === 'true';
            if (isUA) {
                textEl.innerText = textEl.getAttribute('data-orig');
                textEl.setAttribute('data-is-ua', 'false');
                btn.innerHTML = '<span>🇺🇦 На украинском</span>';
                btn.style.borderColor = '#ff3b6f';
                btn.style.color = '#ff3b6f';
                btn.style.background = 'rgba(255, 59, 111, 0.1)';
            } else {
                textEl.innerText = textEl.getAttribute('data-ua');
                textEl.setAttribute('data-is-ua', 'true');
                btn.innerHTML = '<span>🇬🇧 На оригинале</span>';
                btn.style.borderColor = '#00ffc3';
                btn.style.color = '#00ffc3';
                btn.style.background = 'rgba(0, 255, 200, 0.1)';
            }
        };

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        if (modalClose) {
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });
        }

        renderPrompts();
    </script>
</body>
</html>
