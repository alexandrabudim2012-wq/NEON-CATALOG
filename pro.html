<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON CATALOG · PRO Библиотека</title>
    
    <style>
        /* БАЗОВЫЕ СТИЛИ */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        /* ЦВЕТА ДЛЯ ТЕМНОЙ ТЕМЫ */
        :root { 
            --bg-color: #0b0e1a; 
            --card-bg: rgba(18, 25, 40, 0.55); 
            --text-main: #eaeef2; 
            --text-muted: #9aa9c0; 
            --border: rgba(0, 255, 200, 0.25); 
            --accent: #00ffc3; 
        }

        /* ЦВЕТА ДЛЯ МЯГКОЙ СВЕТЛОЙ ТЕМЫ */
        body.light-theme {
            --bg-color: #e8ecef;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2d3748;
            --text-muted: #4a5568;
            --border: rgba(0, 180, 140, 0.3);
        }

        body { background: var(--bg-color); background-image: radial-gradient(circle at 20% 30%, rgba(0, 255, 200, 0.05) 0%, transparent 30%), radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.05) 0%, transparent 35%); min-height: 100vh; display: flex; flex-direction: column; color: var(--text-main); padding: 2rem 1.5rem; position: relative; transition: background 0.3s ease, color 0.3s ease; }
        body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(0, 255, 200, 0.1), transparent 40%), radial-gradient(circle at 70% 80%, rgba(255, 0, 200, 0.1), transparent 40%); pointer-events: none; z-index: 0; }
        .wrapper { max-width: 1200px; margin: 0 auto; width: 100%; position: relative; z-index: 2; }
        
        /* ШАПКА */
        header { text-align: center; margin-bottom: 3rem; animation: fadeSlide 0.8s ease-out; }
        h1 { font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, #b300ff, #ff3b6f, #4d6aff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(180, 0, 255, 0.3); margin-bottom: 0.75rem; line-height: 1.2; }
        
        .tagline { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; backdrop-filter: blur(2px); display: inline-block; padding: 0.3rem 1.5rem; border-radius: 60px; border: 1px solid rgba(180, 0, 255, 0.3); background: rgba(10, 20, 30, 0.4); box-shadow: 0 0 15px rgba(180, 0, 255, 0.1); margin-bottom: 2rem; transition: all 0.3s ease; }
        body.light-theme .tagline { background: rgba(255, 255, 255, 0.6); border-color: rgba(124, 0, 179, 0.3); }
        
        /* МЕНЮ */
        .nav-menu { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .nav-link { color: var(--text-main); text-decoration: none; font-size: 1.1rem; font-weight: 600; padding: 0.6rem 1.5rem; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); transition: all 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: #ffffff; background: #b300ff; border-color: #b300ff; box-shadow: 0 0 20px rgba(180, 0, 255, 0.4); }
        body.light-theme .nav-link { border-color: rgba(0, 0, 0, 0.1); background: rgba(0, 0, 0, 0.05); }
        body.light-theme .nav-link.active { color: #ffffff; background: #7c00b3; border-color: #7c00b3; }

        /* СЕТКА */
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2.5rem; margin-bottom: 3rem; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 2.5rem; padding: 2.5rem 2rem; border: 2px solid var(--border); box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.7); transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), border-color 0.25s ease, box-shadow 0.3s ease, background 0.3s ease; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; position: relative; overflow: hidden; opacity: 0; animation: cardAppear 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; will-change: transform; }
        
        .card:nth-child(1) { border-image: linear-gradient(145deg, #00ffc3, #4d6aff) 1; border-image-slice: 1; }
        .card:nth-child(2) { border-image: linear-gradient(145deg, #b300ff, #ff3b6f) 1; border-image-slice: 1; }
        .card:nth-child(3) { border-image: linear-gradient(145deg, #ff3b6f, #4d6aff) 1; border-image-slice: 1; }
        
        .card:hover { transform: translateY(-12px) scale(1.02); background: rgba(20, 30, 50, 0.85); }
        body.light-theme .card:hover { background: #ffffff; }
        
        .card:nth-child(1):hover { border-color: #00ffc3; box-shadow: 0 25px 50px -12px #00ffc3; }
        .card:nth-child(2):hover { border-color: #b300ff; box-shadow: 0 25px 50px -12px #b300ff; }
        .card:nth-child(3):hover { border-color: #ff3b6f; box-shadow: 0 25px 50px -12px #ff3b6f; }

        .card:hover .card-icon { animation: iconPulse 1.2s ease-in-out infinite; }
        @keyframes iconPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(180, 0, 255, 0.8)); } 50% { transform: scale(1.15); filter: drop-shadow(0 0 25px rgba(180, 0, 255, 1)); } }
        
        .card::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(180, 0, 255, 0.15), transparent); transition: left 0.6s ease; pointer-events: none; }
        .card:hover::after { left: 100%; }

        .card-icon { font-size: 4rem; line-height: 1; margin-bottom: 1.5rem; filter: drop-shadow(0 0 15px rgba(180, 0, 255, 0.7)); transition: transform 0.3s ease, filter 0.3s ease; }
        
        .card h2 { font-size: 2rem; font-weight: 800; letter-spacing: -0.01em; background: linear-gradient(135deg, #ffffff, #d0b0ff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.8rem; }
        body.light-theme .card h2 { background: linear-gradient(135deg, #1a202c, #4a1a6b); -webkit-background-clip: text; background-clip: text; }
        
        .card p { color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; font-weight: 400; opacity: 0.9; }
        
        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 5, 15, 0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: rgba(15, 22, 38, 0.95); backdrop-filter: blur(25px); border: 2px solid rgba(180, 0, 255, 0.4); border-radius: 2.5rem; max-width: 900px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 2.5rem 2rem; box-shadow: 0 0 80px rgba(180, 0, 255, 0.3); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1); position: relative; scrollbar-width: thin; scrollbar-color: #b300ff #1a2235; color: var(--text-main); }
        .modal-overlay.active .modal-content { transform: scale(1); }
        body.light-theme .modal-content { background: rgba(255, 255, 255, 0.98); border-color: rgba(124, 0, 179, 0.4); }
        
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: #1a2235; border-radius: 20px; }
        .modal-content::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #b300ff, #ff3b6f); border-radius: 20px; }
        
        .modal-close { position: absolute; top: 1.2rem; right: 1.5rem; background: none; border: none; font-size: 2.2rem; line-height: 1; color: var(--text-muted); cursor: pointer; transition: color 0.2s, transform 0.2s; z-index: 10; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); }
        .modal-close:hover { color: #b300ff; transform: rotate(90deg); border-color: #b300ff; }
        
        .modal-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 1.5rem; background: linear-gradient(135deg, #b300ff, #ff3b6f); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 2rem; }
        body.light-theme .modal-title { background: linear-gradient(135deg, #7c00b3, #c7004d); -webkit-background-clip: text; background-clip: text; }
        
        .prompt-block { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(180, 0, 255, 0.2); border-radius: 1.5rem; padding: 1.8rem; margin-bottom: 1.5rem; position: relative; }
        body.light-theme .prompt-block { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.08); }
        
        .prompt-block h3 { font-size: 1.3rem; color: #fff; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
        body.light-theme .prompt-block h3 { color: #1a202c; }
        
        .best-tool-link { display: inline-block; font-size: 0.9rem; color: #b300ff; text-decoration: none; margin-bottom: 1.2rem; font-weight: 600; padding: 0.3rem 1rem; border: 1px solid rgba(180, 0, 255, 0.4); border-radius: 20px; background: rgba(180, 0, 255, 0.1); transition: all 0.2s; }
        .best-tool-link:hover { background: rgba(180, 0, 255, 0.25); border-color: #b300ff; color: #e0b0ff; }
        body.light-theme .best-tool-link { color: #7c00b3; border-color: rgba(124, 0, 179, 0.4); background: rgba(124, 0, 179, 0.05); }
        body.light-theme .best-tool-link:hover { background: rgba(124, 0, 179, 0.15); }
        
        .prompt-text { background: rgba(0, 0, 0, 0.4); padding: 1.2rem; border-radius: 12px; border-left: 4px solid #b300ff; font-family: monospace; font-size: 0.95rem; color: #eaeef2; line-height: 1.6; white-space: pre-wrap; margin-bottom: 1.2rem; transition: all 0.3s ease; }
        body.light-theme .prompt-text { background: rgba(255, 255, 255, 0.9); color: #1a202c; border-left-color: #7c00b3; }
        
        .copy-btn { background: rgba(180, 0, 255, 0.1); border: 1px solid #b300ff; color: #b300ff; padding: 0.6rem 1.2rem; border-radius: 30px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .copy-btn:hover { background: #b300ff; color: #ffffff; box-shadow: 0 0 15px rgba(180, 0, 255, 0.4); }
        .copy-btn.copied { background: #b300ff; color: #ffffff; }
        
        @keyframes cardAppear { 0% { opacity: 0; transform: translateY(30px) scale(0.97); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .glow-line { height: 2px; width: 100%; background: linear-gradient(90deg, transparent, #b300ff, #ff3b6f, #4d6aff, transparent); margin-top: 2rem; opacity: 0.4; border-radius: 10px; }

        /* Кнопки управления в шапке */
        .top-controls { position: absolute; top: 1rem; right: 1rem; display: flex; gap: 10px; z-index: 100; }
        .nav-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; width: 44px; height: 44px; font-size: 1.3rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); text-decoration: none; color: var(--text-main); }
        .nav-btn:hover { transform: scale(1.1) rotate(15deg); border-color: #b300ff; box-shadow: 0 0 15px rgba(180, 0, 255, 0.4); }
        body.light-theme .nav-btn { background: rgba(0, 0, 0, 0.05); border-color: rgba(0, 0, 0, 0.1); }
        body.light-theme .nav-btn:hover { border-color: #7c00b3; box-shadow: 0 0 15px rgba(124, 0, 179, 0.3); }

        @media (max-width: 700px) {
            body { padding: 1.5rem 1rem; }
            .catalog-grid { gap: 1.5rem; }
            .card { padding: 1.8rem 1.5rem; border-radius: 2rem; }
            .card h2 { font-size: 1.6rem; }
            .modal-content { padding: 2rem 1.3rem; border-radius: 2rem; }
            .modal-title { font-size: 1.8rem; margin-bottom: 1.5rem; }
            .top-controls { top: 0.5rem; right: 0.5rem; }
        }
        @media (max-width: 450px) {
            .card { padding: 1.5rem 1.2rem; }
            .card-icon { font-size: 3rem; }
            .tagline { font-size: 1rem; }
            .modal-close { top: 0.8rem; right: 1rem; font-size: 1.8rem; width: 38px; height: 38px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="top-controls">
            <a href="start.html" class="nav-btn" title="На главную">🏠</a>
            <button id="themeToggle" class="nav-btn" title="Переключить тему">🌙</button>
        </div>
        
        <header>
            <h1>PRO БИБЛИОТЕКА</h1>
            <div class="tagline">Глубокие промпты для профессионалов</div>
            <nav class="nav-menu">
                <a href="start.html" class="nav-link">Главная</a>
                <a href="pro.html" class="nav-link active">PRO Промпты</a>
            </nav>
        </header>

        <main>
            <div id="catalogGrid" class="catalog-grid"></div>
            <div class="glow-line"></div>
        </main>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ЛОГИКА ТЕМЫ
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            if (themeToggle) themeToggle.textContent = '☀️';
        }
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light-theme');
                if (document.body.classList.contains('light-theme')) {
                    themeToggle.textContent = '☀️';
                    localStorage.setItem('theme', 'light');
                } else {
                    themeToggle.textContent = '🌙';
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        // ДАННЫЕ ПРОМПТОВ
        const promptsData = [
            { 
                icon: '📝', title: 'Копирайтинг и редактура', description: 'Глубокие промпты для бизнеса, рекламы и контента.', prompts: [
                    { title: '🛍️ Продающее описание товара (AIDA)', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Ты — профессиональный конверсионный копирайтер с опытом в e-commerce. Напиши продающее описание для товара: [название товара]. Характеристики: [перечисли]. Целевая аудитория: [опиши]. Используй классическую формулу AIDA (Внимание, Интерес, Желание, Действие). Начни с цепляющего вопроса или факта. В блоке "Желание" опиши, как изменится жизнь клиента после покупки. В конце — четкий призыв к действию. Обязательно используй эмодзи для визуального выделения блоков.', uaText: 'Ти — професійний конверсійний копірайтер з досвідом в e-commerce. Напиши продаючий опис для товару: [назва товару]. Характеристики: [перелічи]. Цільова аудиторія: [опиши]. Використовуй класичну формулу AIDA (Увага, Інтерес, Бажання, Дія). Почни з чіпкого питання або факту. У блоці "Бажання" опиши, як зміниться життя клієнта після покупки. В кінці — чіткий заклик до дії. Обов\'язково використовуй емодзі для візуального виділення блоків.' },
                    { title: '📱 Единичный пост для соцсетей', bestTool: 'Claude', bestToolUrl: 'https://claude.ai', text: 'Выступи в роли SMM-специалиста. Напиши один вирусный пост для [Instagram/Telegram] на тему: [тема]. Структура: 1) Мощный хук (первая строка, которая остановит скроллинг). 2) Личная история или неожиданный факт. 3) Основная мысль (3-4 коротких абзаца). 4) Вопрос к аудитории для вовлечения в комментарии. 5) 5 релевантных хештегов. Тон: живой, дружелюбный, без канцелярита.', uaText: 'Виступи в ролі SMM-спеціаліста. Напиши один вірусний пост для [Instagram/Telegram] на тему: [тема]. Структура: 1) Потужний гачок (перший рядок, який зупинить скролінг). 2) Особиста історія або несподіваний факт. 3) Основна думка (3-4 коротких абзаци). 4) Питання до аудиторії для залучення в коментарі. 5) 5 релевантних хештегів. Тон: живий, дружній, без канцеляриту.' },
                    { title: '💥 Слоганы и девизы', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Ты — креативный директор брендингового агентства. Придумай 10 вариантов слоганов для бренда: [название]. Сфера: [сфера]. Главная ценность: [в чем уникальность]. Раздели слоганы на 3 категории: 3 дерзких (провокационных), 3 эмоциональных (вдохновляющих) и 4 информативных (четко объясняющих суть). Каждый слоган должен быть не длиннее 7 слов.', uaText: 'Ти — креативний директор брендингового агентства. Придумай 10 варіантів слоганів для бренду: [назва]. Сфера: [сфера]. Головна цінність: [в чому унікальність]. Розділи слогани на 3 категорії: 3 зухвалих (провокаційних), 3 емоційних (надихаючих) і 4 інформативних (чітко пояснюють суть). Кожен слоган повинен бути не довше 7 слів.' },
                    { title: '📢 Маркетинговый текст (Email/Реклама)', bestTool: 'Claude', bestToolUrl: 'https://claude.ai', text: 'Напиши текст для рекламного баннера или email-рассылки. Продукт: [что продаем]. Главная боль клиента: [например: нехватка времени]. Наше решение: [как продукт решает проблему]. Предложи 3 варианта заголовков (Subject Line) с высоким CTR. Сам текст сделай коротким (до 500 знаков), с одной яркой мыслью и понятным призывом к действию (купить, зарегистрироваться, скачать).', uaText: 'Напиши текст для рекламного банера або email-розсилки. Продукт: [що продаємо]. Головний біль клієнта: [наприклад: брак часу]. Наше рішення: [як продукт вирішує проблему]. Запропонуй 3 варіанти заголовків (Subject Line) з високим CTR. Сам текст зроби коротким (до 500 знаків), з однією яскравою думкою і зрозумілим закликом до дії (купити, зареєструватися, скачати).' },
                    { title: '✍️ Редактура и перепись «по-человечески»', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Выступи в роли строгого, но гениального редактора. Возьми этот текст: [вставь текст]. Перепиши его так, чтобы он звучал максимально естественно и живо. Убери речевые штампы, канцеляризмы, тавтологию и воду. Сделай предложения короче (не более 15-20 слов). Используй активный залог вместо пассивного. Сохрани при этом исходный смысл и факты. Сделай текст интересным для чтения.', uaText: 'Виступи в ролі суворого, але геніального редактора. Візьми цей текст: [вставь текст]. Перепиши його так, щоб він звучав максимально природно і жваво. Прибери мовні штампи, канцеляризми, тавтологію і воду. Зроби речення коротшими (не більше 15-20 слів). Використовуй активний стан замість пасивного. Збережи при цьому вихідний зміст і факти. Зроби текст цікавим для читання.' },
                    { title: '📖 Продающий сторителлинг', bestTool: 'DeepSeek', bestToolUrl: 'https://chat.deepseek.com', text: 'Ты — мастер сторителлинга. Напиши историю от первого лица на тему: [например: как я запустил бизнес с нуля]. Главный герой: [ты / вымышленный персонаж]. Проблема (дно): [опиши трудность]. Путь решения: [как он справился, какие были ошибки]. Триумф: [результат]. Мораль/вывод: [что понял герой]. История должна быть эмоциональной, честной и удерживать внимание до последней строчки.', uaText: 'Ти — майстер сторітелінгу. Напиши історію від першої особи на тему: [наприклад: як я запустив бізнес з нуля]. Головний герой: [ти / вигаданий персонаж]. Проблема (дно): [опиши труднощі]. Шлях рішення: [як він впорався, які були помилки]. Тріумф: [результат]. Мораль/висновок: [що зрозумів герой]. Історія повинна бути емоційною, чесною і утримувати увагу до останнього рядка.' },
                    { title: '🖥️ Продающий лендинг (Landing Page)', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Ты — ведущий копирайтер. Напиши структуру и текст для одностраничного лендинга под продукт: [название]. Целевая аудитория: [описание]. Структура: 1) Оффер (УТП + кнопка). 2) Боли клиента (почему им нужен продукт). 3) Решение (как работает продукт). 4) Преимущества (3-5 пунктов). 5) Социальное доказательство (отзывы/цифры). 6) Гарантии. 7) Призыв к действию (CTA). Текст должен быть убедительным, лаконичным и вести клиента за руку к покупке.', uaText: 'Ти — провідний копірайтер. Напиши структуру і текст для односторінкового лендінгу під продукт: [назва]. Цільова аудиторія: [опис]. Структура: 1) Оффер (УТП + кнопка). 2) Болі клієнта (чому їм потрібен продукт). 3) Рішення (як працює продукт). 4) Переваги (3-5 пунктів). 5) Соціальний доказ (відгуки/цифри). 6) Гарантії. 7) Заклик до дії (CTA). Текст повинен бути переконливим, лаконічним і вести клієнта за руку до покупки.' },

                    { title: '📝 Редактура сложного текста', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Перепиши мой сложный текст: [вставь текст]. Используй принцип "Пирамида Минто" (сначала главный вывод, потом аргументы). Убери сложные термины или объясни их простыми словами. Структурируй текст: добавь маркированные списки, выдели главные мысли жирным. Сделай так, чтобы текст можно было прочитать по диагонали и понять суть. Тон: профессиональный, но доступный.', uaText: 'Перепиши мій складний текст: [вставь текст]. Використовуй принцип "Піраміда Мінто" (спочатку головний висновок, потім аргументи). Прибери складні терміни або поясни їх простими словами. Структуруй текст: додай марковані списки, виділи головні думки жирним. Зроби так, щоб текст можна було прочитати по діагоналі і зрозуміти суть. Тон: професійний, але доступний.' },
                    { title: '🎬 Сценарий для Reels/TikTok', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Ты — сценарист вирусных коротких видео. Напиши сценарий для видео (до 30 секунд) на тему: [тема]. Формат: 1) Хук (0-3 сек — действие или громкая фраза, чтобы зацепить). 2) Основная часть (проблема и решение, покажи, что снимать в кадре). 3) Призыв к действию (подписка/комментарий). Напиши текст для озвучки и описание видеоряда (что происходит на экране). Добавь идеи для трендового звука.', uaText: 'Ти — сценарист вірусних коротких відео. Напиши сценарій для відео (до 30 секунд) на тему: [тема]. Формат: 1) Гачок (0-3 сек — дія або гучна фраза, щоб зачепити). 2) Основна частина (проблема і рішення, покажи, що знімати в кадрі). 3) Заклик до дії (підписка/коментар). Напиши текст для озвучки і опис відеоряду (що відбувається на екрані). Додай ідеї для трендового звуку.' }

            { 
                icon: '💼', title: 'Продажи, CRM', description: 'Скрипты, работа с возражениями и автоматизация.', prompts: [

                    { title: '📞 Скрипт холодного звонка', bestTool: 'Claude', bestToolUrl: 'https://claude.ai', text: 'Ты — эксперт по холодным продажам. Напиши скрипт звонка для продажи [продукт/услуга]. Структура: 1) Приветствие за 10 секунд (пробить барьер). 2) Крюк внимания (вопрос, который заставит клиента слушать). 3) Короткая презентация оффера (только выгоды). 4) Работа с типичными возражениями ("Мне не интересно", "Нет времени"). 5) Закрытие на следующий шаг (встреча или отправка КП). Добавь варианты фраз, если клиент молчит или раздражен.', uaText: 'Ти — експерт з холодних продажів. Напиши скрипт дзвінка для продажу [продукт/послуга]. Структура: 1) Привітання за 10 секунд (пробити бар\'єр). 2) Гачок уваги (питання, яке змусить клієнта слухати). 3) Коротка презентація оферу (тільки вигоди). 4) Робота з типовими запереченнями ("Мені не цікаво", "Немає часу"). 5) Закриття на наступний крок (зустріч або відправка КП). Додай варіанти фраз, якщо клієнт мовчить або роздратований.' },
                    { title: '💸 Генерация скриптов продаж (A/B тесты)', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Выступи в роли руководителя отдела продаж. Напиши 2 разных варианта скрипта для переписки с клиентом по продаже [товар/услуга]. Вариант А: строго официальный, деловой, на "Вы". Вариант Б: дружелюбный, с эмодзи и легким сленгом, на "ты". В каждом варианте: крюк, квалификация (2 вопроса), презентация, работа с возражением, закрытие на оплату.', uaText: 'Виступи в ролі керівника відділу продажів. Напиши 2 різних варіанти скрипта для переписки з клієнтом щодо продажу [товар/послуга]. Варіант А: строго офіційний, діловий, на "Ви". Варіант Б: дружній, з емодзі та легким сленгом, на "ти". У кожному варіанті: гачок, кваліфікація (2 питання), презентація, робота із запереченням, закриття на оплату.' },
                    { title: '🤖 Чат-бот для сайта (сценарий)', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Ты — специалист по чат-ботам. Напиши сценарий (диалоговое дерево) для бота на сайте. Сфера: [например: доставка суши]. Бот должен: 1) Поздороваться и предложить помощь. 2) Ответить на 3 частых вопроса (доставка, оплата, скидки). 3) Собрать контакт (имя и телефон). 4) Передать менеджеру. Напиши точные фразы бота и кнопки, которые увидит клиент.', uaText: 'Ти — спеціаліст з чат-ботів. Напиши сценарій (діалогове дерево) для бота на сайті. Сфера: [наприклад: доставка суші]. Бот повинен: 1) Привітатися і запропонувати допомогу. 2) Відповісти на 3 частих питання (доставка, оплата, знижки). 3) Зібрати контакт (ім\'я і телефон). 4) Передати менеджеру. Напиши точні фрази бота і кнопки, які побачить клієнт.' },
                    { title: '📱 Автоматизация переписок в Instagram', bestTool: 'ManyChat', bestToolUrl: 'https://manychat.com', text: 'Напиши сценарий для ManyChat (автоответы в Instagram). Триггер: клиент пишет слово "[ключевое слово, например: ЦЕНА]" в комментариях или Direct. Сценарий: 1) Автоответ: "Привет! Скинул прайс в личку, проверь 📩". 2) Сообщение в Direct с прайсом и вопросом "Какая модель тебе нравится?". 3) Если клиент ответил — уточни адрес и предложи оформить заказ. Напиши все тексты сообщений.', uaText: 'Напиши сценарій для ManyChat (автовідповіді в Instagram). Тригер: клієнт пише слово "[ключове слово, наприклад: ЦІНА]" в коментарях або Direct. Сценарій: 1) Автовідповідь: "Привіт! Скинув прайс в особисті, перевір 📩". 2) Повідомлення в Direct з прайсом і питанням "Яка модель тобі подобається?". 3) Якщо клієнт відповів — уточни адресу і запропонуй оформити замовлення. Напиши всі тексти повідомлень.' },
                    { title: '✉️ Автоматизация рассылок в Telegram', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Составь цепочку из 3 сообщений для приветственной рассылки в Telegram-боте. Цель: прогреть подписчика и продать [продукт/услугу]. Сообщение 1 (сразу после подписки): знакомство + обещание пользы + кнопка "Забрать бонус". Сообщение 2 (через день): кейс или отзыв клиента. Сообщение 3 (через 2 дня): оффер с ограничением по времени (скидка 24 часа). Напиши тексты и кнопки для каждого шага.', uaText: 'Склади ланцюжок з 3 повідомлень для вітальної розсилки в Telegram-боті. Мета: прогріти підписника і продати [продукт/послугу]. Повідомлення 1 (відразу після підписки): знайомство + обіцянка користі + кнопка "Забрати бонус". Повідомлення 2 (через день): кейс або відгук клієнта. Повідомлення 3 (через 2 дні): офер з обмеженням за часом (знижка 24 години). Напиши тексти і кнопки для кожного кроку.' },

                    { title: '📈 Графики и поиск закономерностей', bestTool: 'Gemini', bestToolUrl: 'https://gemini.google.com', text: 'Ты — аналитик с опытом визуализации данных. Я прикрепил файл с данными (Excel/CSV). Построй 3 разных графика и объясни, что они показывают: 1) Линейный график динамики продаж по месяцам — найди тренд (рост/падение). 2) Круговую диаграмму распределения клиентов по категориям — какой сегмент самый крупный. 3) Столбчатую диаграмму зависимости выручки от региона — какой регион самый прибыльный. По каждому графику напиши краткий вывод и одну рекомендацию.', uaText: 'Ти — аналітик з досвідом візуалізації даних. Я прикріпив файл з даними (Excel/CSV). Побудуй 3 різних графіки і поясни, що вони показують: 1) Лінійний графік динаміки продажів за місяцями — знайди тренд (зростання/падіння). 2) Кругову діаграму розподілу клієнтів за категоріями — який сегмент найбільший. 3) Стовпчасту діаграму залежності виручки від регіону — який регіон найприбутковіший. По кожному графіку напиши короткий висновок і одну рекомендацію.' },
                    { title: '🧮 Таблицы с ИИ (сводки и генерация)', bestTool: 'Rows AI', bestToolUrl: 'https://rows.com', text: 'Выступи в роли эксперта по автоматизации таблиц. У меня есть таблица в Google Sheets / Rows с колонками: [перечисли колонки, например: Имя клиента, Товар, Комментарий, Сумма]. Напиши 3 идеи, как я могу использовать встроенный ИИ в таблицах, чтобы автоматизировать рутину. Например: 1) Автоматически генерировать краткое резюме по каждой строке. 2) Переводить комментарии клиентов с другого языка. 3) Находить ошибочные или подозрительные записи. Для каждой идеи напиши, какую формулу или функцию использовать.', uaText: 'Виступи в ролі експерта з автоматизації таблиць. У мене є таблиця в Google Sheets / Rows з колонками: [перелічи колонки, наприклад: Ім\'я клієнта, Товар, Коментар, Сума]. Напиши 3 ідеї, як я можу використовувати вбудований ШІ в таблицях, щоб автоматизувати рутину. Наприклад: 1) Автоматично генерувати короткий резюме по кожному рядку. 2) Перекладати коментарі клієнтів з іншої мови. 3) Знаходити помилкові або підозрілі записи. Для кожної ідеї напиши, яку формулу або функцію використовувати.' },
                    { title: '🧹 Проверка данных на ошибки', bestTool: 'ChatGPT', bestToolUrl: 'https://chat.openai.com', text: 'Ты — специалист по качеству данных (Data Quality). Я прикрепил выгрузку. Проверь её на наличие ошибок и аномалий: 1) Найди пустые ячейки (пропуски). 2) Найди дубликаты записей (например, по номеру телефона или email). 3) Найди отрицательные или нулевые суммы в столбце с выручкой. 4) Найди выбросы (значения, которые сильно отличаются от остальных). Выведи список найденных ошибок и напиши, как каждую из них можно исправить в Excel/Google Sheets.', uaText: 'Ти — спеціаліст з якості даних (Data Quality). Я прикріпив вивантаження. Перевір її на наявність помилок і аномалій: 1) Знайди порожні клітинки (пропуски). 2) Знайди дублікати записів (наприклад, за номером телефону або email). 3) Знайди негативні або нульові суми в стовпці з виручкою. 4) Знайди викиди (значення, які сильно відрізняються від інших). Виведи список знайдених помилок і напиши, як кожну з них можна виправити в Excel/Google Sheets.' }

        const grid = document.getElementById('catalogGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalClose');

        function renderPrompts() {
            if (!grid) return;
            grid.innerHTML = '';

            promptsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <div class="card-icon">${item.icon}</div>
                    <h2>${item.title}</h2>
                    <p>${item.description}</p>
                `;

                card.addEventListener('click', () => openPromptModal(item));
                grid.appendChild(card);
            });
        }

        function openPromptModal(item) {
            let contentHTML = `<div class="modal-title">${item.icon} ${item.title}</div>`;

            if (!item.prompts || item.prompts.length === 0) {
                contentHTML += `<p style="color: #b6c8e0;">Промпты для этого раздела скоро появятся!</p>`;
            } else {
                item.prompts.forEach((p, i) => {
                    const uniqueId = `prompt-${item.title.replace(/\s+/g, '-')}-${i}`;
                    const toolHTML = p.bestTool ? `<a href="${p.bestToolUrl}" target="_blank" class="best-tool-link">➔ Лучший выбор: ${p.bestTool} ↗</a>` : '';
                    
                    const safeOrig = p.text.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const safeUa = (p.uaText || p.text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                    contentHTML += `
                        <div class="prompt-block">
                            <h3>✨ ${p.title}</h3>
                            ${toolHTML}
                            <div class="prompt-text" id="${uniqueId}" data-orig="${safeOrig}" data-ua="${safeUa}">${p.text}</div>
                            
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <button class="copy-btn" onclick="copyPrompt('${uniqueId}', this)">
                                    <span>📋 Скопировать</span>
                                </button>
                                ${p.uaText ? `
                                <button class="copy-btn ua-btn" onclick="toggleTranslate('${uniqueId}', this)">
                                    <span>🇺🇦 На украинском</span>
                                </button>` : ''}
                            </div>
                        </div>
                    `;
                });
            }

            modalBody.innerHTML = contentHTML;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        window.copyPrompt = function(elementId, btn) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span>✅ Скопировано!</span>';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        };

        window.toggleTranslate = function(elementId, btn) {
            const textEl = document.getElementById(elementId);
            const isUA = textEl.getAttribute('data-is-ua') === 'true';
            if (isUA) {
                textEl.innerText = textEl.getAttribute('data-orig');
                textEl.setAttribute('data-is-ua', 'false');
                btn.innerHTML = '<span>🇺🇦 На украинском</span>';
                btn.style.borderColor = '#ff3b6f';
                btn.style.color = '#ff3b6f';
                btn.style.background = 'rgba(255, 59, 111, 0.1)';
            } else {
                textEl.innerText = textEl.getAttribute('data-ua');
                textEl.setAttribute('data-is-ua', 'true');
                btn.innerHTML = '<span>🇬🇧 На оригинале</span>';
                btn.style.borderColor = '#b300ff';
                btn.style.color = '#b300ff';
                btn.style.background = 'rgba(180, 0, 255, 0.1)';
            }
        };

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        if (modalClose) {
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });
        }

        renderPrompts();
    </script>
